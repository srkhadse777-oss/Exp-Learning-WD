<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bootstrap Code Playground</title>

<!-- Bootstrap CDN -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
body {
    background-color: #0f172a;
    color: white;
}

/* Editor Styling */
textarea {
    height: 300px;
    font-family: monospace;
    background-color: #020617;
    color: #38bdf8;
    border: none;
    outline: none;
}

/* Output iframe */
iframe {
    height: 300px;
    background: white;
    border: none;
}

/* Card dark theme */
.card {
    background-color: #020617;
    border: 1px solid #1e293b;
}
</style>

</head>

<body>

<!-- Header -->
<header class="text-center p-3 border-bottom border-secondary">
    <h2>HTML Tutorial Playground</h2>
    <p>Practice your code live using Bootstrap UI</p>
</header>

<div class="container-fluid mt-3">

    <div class="row g-3">

        <!-- Editor Section -->
        <div class="col-md-6">
            <div class="card">
                <div class="card-header">Code Editor</div>
                <div class="card-body">

<textarea id="code" class="form-control">
<h1>This is a Level 1 Heading</h1>
<p>This is the main introduction.</p>

<h2>This is a Level 2 Heading</h2>
<p>This is a sub-topic under the main title.</p>

<h3>This is a Level 3 Heading</h3>
<p>This is a specific detail under H2.</p>
</textarea>

                    <div class="mt-3">
                        <button class="btn btn-info" onclick="runCode()">Run</button>
                        <button class="btn btn-danger" onclick="clearCode()">Clear</button>

                        <div class="form-check form-switch d-inline ms-3">
                            <input class="form-check-input" type="checkbox" id="autoRun">
                            <label class="form-check-label">Auto Run</label>
                        </div>
                    </div>

                </div>
            </div>
        </div>

        <!-- Output Section -->
        <div class="col-md-6">
            <div class="card">
                <div class="card-header">Output</div>
                <div class="card-body p-0">
                    <iframe id="output" class="w-100"></iframe>
                </div>
            </div>
        </div>

    </div>

</div>

<footer class="text-center mt-3 p-2 border-top border-secondary">
    <p>Practice makes perfect 🚀</p>
</footer>

<script>
const codeArea = document.getElementById("code");
const output = document.getElementById("output");
const autoRun = document.getElementById("autoRun");

function runCode() {
    output.srcdoc = codeArea.value;
}

function clearCode() {
    codeArea.value = "";
    output.srcdoc = "";
}

/* Auto Run */
codeArea.addEventListener("input", () => {
    if (autoRun.checked) {
        runCode();
    }
});

/* Run on load */
runCode();
</script>

</body>
</html>
